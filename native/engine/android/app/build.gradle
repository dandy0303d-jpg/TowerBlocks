import org.apache.tools.ant.taskdefs.condition.Os

apply plugin: 'com.android.application'
// Kotlin — GoogleWebOAuthBridge.kt (account-bind Custom Tabs flow)
// is Kotlin, so without this plugin the .kt won't compile and
// AppActivity.java can't find com.cocos.game.GoogleWebOAuthBridge.
apply plugin: 'kotlin-android'

RES_PATH = RES_PATH.replace("\\", "/")
COCOS_ENGINE_PATH = COCOS_ENGINE_PATH.replace("\\", "/")

buildDir = "${RES_PATH}/proj/build/${project.name ==~ /^[_a-zA-Z0-9-]+$/ ? project.name : 'CocosGame'}"
android {
    compileSdkVersion PROP_COMPILE_SDK_VERSION.toInteger()
    buildToolsVersion PROP_BUILD_TOOLS_VERSION
    ndkVersion PROP_NDK_VERSION
    namespace APPLICATION_ID

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // Kotlin JVM target aligned with the Java options above. Required
    // once the kotlin-android plugin is applied — otherwise compilation
    // fails with "inconsistent JVM targets" when Java class files (1.8)
    // and Kotlin class files (defaults to 1.6) end up in the same jar.
    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId APPLICATION_ID
        minSdkVersion PROP_MIN_SDK_VERSION
        targetSdkVersion PROP_TARGET_SDK_VERSION
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                targets "cocos"
                arguments "-DRES_DIR=${RES_PATH}", "-DANDROID_STL=c++_static", "-DANDROID_TOOLCHAIN=clang", "-DANDROID_ARM_NEON=TRUE"
            }
            ndk { abiFilters PROP_APP_ABI.split(':') }
        }
    }

    sourceSets.main {
        java.srcDirs "../src", "src"
        res.srcDirs "../res", 'res', "${RES_PATH}/proj/res"
        jniLibs.srcDirs "../libs", 'libs'
        manifest.srcFile "AndroidManifest.xml"
        assets.srcDir "${RES_PATH}/data"
        jniLibs {
            // Vulkan validation layer
            // srcDir "${android.ndkDirectory}/sources/third_party/vulkan/src/build-android/jniLibs"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging Boolean.parseBoolean(PROP_ENABLE_COMPRESS_SO)
        }
    }

    externalNativeBuild {
        cmake {
            version "3.22.1"
            path "../CMakeLists.txt"
            buildStagingDirectory "${RES_PATH}/proj/build"
        }
    }

    signingConfigs {

       release {
            if (project.hasProperty("RELEASE_STORE_FILE") && !RELEASE_STORE_FILE.isEmpty()) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
                        
            externalNativeBuild {
                cmake {
                    // switch HIDE_SYMBOLS to OFF to skip compilation flag `-fvisibility=hidden`
                    arguments "-DHIDE_SYMBOLS=ON"
                }
            }

            if (!Boolean.parseBoolean(PROP_IS_DEBUG)) {
                getIsDefault().set(true)
            }

        }

        debug {
            debuggable true
            jniDebuggable true
            renderscriptDebuggable true
            // resValue  "string", "app_name", "${PROP_APP_NAME}-dbg"
            // applicationIdSuffix ".debug"
        }
    }
}

dependencies {
    implementation fileTree(dir: '../libs', include: ['*.jar','*.aar'])
    implementation fileTree(dir: 'libs', include: ['*.jar','*.aar'])
    implementation fileTree(dir: "${COCOS_ENGINE_PATH}/cocos/platform/android/java/libs", include: ['*.jar'])
    implementation project(':libservice')
    implementation project(':libcocos')
    if (Boolean.parseBoolean(PROP_ENABLE_INPUTSDK)) {
        implementation 'com.google.android.libraries.play.games:inputmapping:1.1.0-beta'
        implementation "org.jetbrains.kotlin:kotlin-stdlib:1.4.10"
    }

    // =========================================================
    // Google Web OAuth (channel-agnostic)
    // =========================================================
    // Chrome Custom Tabs — used by GoogleWebOAuthBridge.kt to open
    // the Google OAuth consent screen without the Google Sign-In SDK.
    // This lets the account-bind flow work even on devices that ship
    // without Google Play Services (GMS). androidx.browser is ~50 KB
    // and has no transitive GMS dependency.
    implementation 'androidx.browser:browser:1.8.0'
    // Kotlin stdlib — needed at RUNTIME by GoogleWebOAuthBridge.kt (and
    // any other Kotlin bridge we add later). Must match the version
    // pinned in the top-level buildscript's kotlin-gradle-plugin
    // classpath (2.1.21); mismatched stdlib on some devices trips
    // "NoSuchMethodError" on Kotlin intrinsics.
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.21"
}
