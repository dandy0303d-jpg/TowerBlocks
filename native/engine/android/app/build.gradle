import org.apache.tools.ant.taskdefs.condition.Os

// Buildscript classpath for the Kotlin plugin. Cocos generates the
// top-level proj/build.gradle from its own template and pulls this
// file in via `apply from:`, which means any `buildscript` block in
// native/engine/android/build.gradle is IGNORED by the root project
// (apply-from's buildscript scope is only the applied script itself).
// Declaring the classpath HERE keeps it scoped to CocosGame:app but
// still available before `apply plugin: 'kotlin-android'` runs.
// Version must match the Kotlin stdlib coordinate in dependencies
// below and any transitive stdlib the channel SDKs pull in.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.21"
        // Firebase plugin classpaths — Cocos IGNORES the top-level
        // `native/engine/android/build.gradle` buildscript block (see
        // the note above), so the Google Services + Crashlytics
        // plugins MUST also be declared here or `apply plugin:
        // 'com.google.gms.google-services'` below fails with
        // "Plugin with id ... not found". Harmless when Firebase is
        // disabled (no google-services.json → plugins aren't applied).
        classpath 'com.google.gms:google-services:4.4.2'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2'
    }
}

apply plugin: 'com.android.application'
// Kotlin — GoogleWebOAuthBridge.kt (account-bind Custom Tabs flow)
// is Kotlin, so without this plugin the .kt won't compile and
// AppActivity.java can't find com.cocos.game.GoogleWebOAuthBridge.
apply plugin: 'kotlin-android'

// ─── Firebase — Google Services plugin, conditional apply ─────
// Firebase Analytics / Crashlytics / Remote Config need the Google
// Services Gradle plugin to process `google-services.json` at build
// time. That JSON is NOT in git (it contains project-specific keys),
// so we only apply the plugin when the file is present. Machines
// without the config just skip Firebase init — FirebaseBridge.kt
// notices the missing FirebaseApp and becomes inert, so the game
// still builds and runs (data collection is simply off).
//
// To enable Firebase on your machine: drop google-services.json into
// this app/ directory (same dir as this build.gradle), rebuild.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
    project.ext.firebaseEnabled = true
} else {
    logger.warn("[Firebase] google-services.json not found in app/ — Firebase disabled")
    project.ext.firebaseEnabled = false
}

RES_PATH = RES_PATH.replace("\\", "/")
COCOS_ENGINE_PATH = COCOS_ENGINE_PATH.replace("\\", "/")

// ─── Auto-bumped versionCode + versionName ─────────────────────
// Persisted in app/version.properties (tracked in git, one file per
// channel branch so each store keeps its own numbering line). Each
// time we invoke a task that produces a shippable artifact
// (assemble* / bundle*), versionCode += 1 and versionName's patch
// segment += 1. Sync-only invocations (Android Studio's Gradle sync,
// clean, cache tasks) do NOT bump — that would spin the counter on
// every IDE open.
def versionProps    = new Properties()
def versionPropFile = file('version.properties')
if (versionPropFile.exists()) {
    versionPropFile.withReader { versionProps.load(it) }
} else {
    versionProps.setProperty('VERSION_CODE', '1')
    versionProps.setProperty('VERSION_NAME', '1.0.0')
}
def _vCode = versionProps.getProperty('VERSION_CODE').toInteger()
def _vName = versionProps.getProperty('VERSION_NAME')
// Only bump on RELEASE artifact tasks — debug builds (Studio Run,
// installDebug, assembleDebug) leave version.properties alone so
// gradle's incremental cache stays intact and Run stays fast.
def _shouldBump = gradle.startParameter.taskNames.any { n ->
    def s = n.toLowerCase()
    // assembleRelease / bundleRelease / packageRelease / installRelease,
    // plus the top-level meta-tasks "assemble" / "bundle" when
    // invoked bare (some CI scripts do that).
    s.contains('release') && (s.contains('assemble') || s.contains('bundle') || s.contains('package') || s.contains('install'))
        || s == 'assemble' || s == 'bundle'
}
if (_shouldBump) {
    _vCode += 1
    def parts = _vName.tokenize('.')
    while (parts.size() < 3) parts << '0'
    parts[2] = ((parts[2] as int) + 1).toString()
    _vName = parts.join('.')
    versionProps.setProperty('VERSION_CODE', _vCode.toString())
    versionProps.setProperty('VERSION_NAME', _vName)
    versionPropFile.withWriter { versionProps.store(it, null) }
    logger.lifecycle("[version] bumped to versionCode=${_vCode} versionName=${_vName}")
}
project.ext.autoVersionCode = _vCode
project.ext.autoVersionName = _vName

buildDir = "${RES_PATH}/proj/build/${project.name ==~ /^[_a-zA-Z0-9-]+$/ ? project.name : 'CocosGame'}"
android {
    compileSdkVersion PROP_COMPILE_SDK_VERSION.toInteger()
    buildToolsVersion PROP_BUILD_TOOLS_VERSION
    ndkVersion PROP_NDK_VERSION
    namespace APPLICATION_ID

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // Kotlin JVM target aligned with the Java options above. Required
    // once the kotlin-android plugin is applied — otherwise compilation
    // fails with "inconsistent JVM targets" when Java class files (1.8)
    // and Kotlin class files (defaults to 1.6) end up in the same jar.
    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId APPLICATION_ID
        minSdkVersion PROP_MIN_SDK_VERSION
        // Force targetSdk = 36. Google Play (Aug 2025 policy) requires
        // 36+ for new uploads, and we don't want the target level to
        // silently drop back to whatever's set in the Cocos Creator
        // Build panel (currently 34 on this machine — that's what
        // triggered the Play Console "target API 36 이상" error).
        targetSdkVersion 36
        // Sourced from app/version.properties, auto-bumped above when
        // an assemble/bundle/install task is on the graph.
        versionCode project.ext.autoVersionCode
        versionName project.ext.autoVersionName

        externalNativeBuild {
            cmake {
                targets "cocos"
                arguments "-DRES_DIR=${RES_PATH}", "-DANDROID_STL=c++_static", "-DANDROID_TOOLCHAIN=clang", "-DANDROID_ARM_NEON=TRUE"
            }
            ndk { abiFilters PROP_APP_ABI.split(':') }
        }
    }

    sourceSets.main {
        java.srcDirs "../src", "src"
        res.srcDirs "../res", 'res', "${RES_PATH}/proj/res"
        jniLibs.srcDirs "../libs", 'libs'
        manifest.srcFile "AndroidManifest.xml"
        assets.srcDir "${RES_PATH}/data"
        jniLibs {
            // Vulkan validation layer
            // srcDir "${android.ndkDirectory}/sources/third_party/vulkan/src/build-android/jniLibs"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging Boolean.parseBoolean(PROP_ENABLE_COMPRESS_SO)
        }
    }

    externalNativeBuild {
        cmake {
            version "3.22.1"
            path "../CMakeLists.txt"
            buildStagingDirectory "${RES_PATH}/proj/build"
        }
    }

    signingConfigs {

       release {
            if (project.hasProperty("RELEASE_STORE_FILE") && !RELEASE_STORE_FILE.isEmpty()) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
                        
            externalNativeBuild {
                cmake {
                    // switch HIDE_SYMBOLS to OFF to skip compilation flag `-fvisibility=hidden`
                    arguments "-DHIDE_SYMBOLS=ON"
                }
            }

            if (!Boolean.parseBoolean(PROP_IS_DEBUG)) {
                getIsDefault().set(true)
            }

        }

        debug {
            debuggable true
            jniDebuggable true
            renderscriptDebuggable true
            // resValue  "string", "app_name", "${PROP_APP_NAME}-dbg"
            // applicationIdSuffix ".debug"
        }
    }
}

dependencies {
    implementation fileTree(dir: '../libs', include: ['*.jar','*.aar'])
    implementation fileTree(dir: 'libs', include: ['*.jar','*.aar'])
    implementation fileTree(dir: "${COCOS_ENGINE_PATH}/cocos/platform/android/java/libs", include: ['*.jar'])
    implementation project(':libservice')
    implementation project(':libcocos')
    if (Boolean.parseBoolean(PROP_ENABLE_INPUTSDK)) {
        implementation 'com.google.android.libraries.play.games:inputmapping:1.1.0-beta'
        implementation "org.jetbrains.kotlin:kotlin-stdlib:1.4.10"
    }

    // =========================================================
    // Google Web OAuth (channel-agnostic)
    // =========================================================
    // Chrome Custom Tabs — used by GoogleWebOAuthBridge.kt to open
    // the Google OAuth consent screen without the Google Sign-In SDK.
    // This lets the account-bind flow work even on devices that ship
    // without Google Play Services (GMS). androidx.browser is ~50 KB
    // and has no transitive GMS dependency.
    implementation 'androidx.browser:browser:1.8.0'
    // Kotlin stdlib — needed at RUNTIME by GoogleWebOAuthBridge.kt (and
    // any other Kotlin bridge we add later). Must match the version
    // pinned in the top-level buildscript's kotlin-gradle-plugin
    // classpath (2.1.21); mismatched stdlib on some devices trips
    // "NoSuchMethodError" on Kotlin intrinsics.
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.21"

    // =========================================================
    // Firebase — Analytics, Crashlytics, Remote Config
    // =========================================================
    // BoM (bill of materials) pins mutually-compatible versions across
    // all firebase-* artifacts. Bump the BoM version and all sub-libs
    // stay in lock-step. Modules listed below are enough for the three
    // features we use today; add more (messaging, dynamiclinks, ...)
    // by appending the artifact name only (no version needed — BoM
    // provides it).
    //
    // Analytics is intentionally listed even though Crashlytics + RC
    // both transitively depend on it — makes the intent explicit and
    // survives dependency graph shuffles across BoM upgrades.
    //
    // These lines are always emitted; if google-services.json is
    // missing the plugin skip above means the classpath resolves but
    // Firebase.initializeApp() returns null at runtime and the bridge
    // becomes inert. No harm in shipping the classes.
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-config'
}
